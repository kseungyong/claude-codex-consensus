name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/shellcheck.yml']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
